name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Build tests
        run: swift build --build-tests

  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    container:
      image: swift:6.0
    steps:
      - uses: actions/checkout@v4

      - name: Install zlib headers
        run: apt-get update && apt-get install -y zlib1g-dev

      - name: Build
        run: swift build

  test:
    name: Test
    runs-on: ubuntu-latest
    container:
      image: swift:6.0
    steps:
      - uses: actions/checkout@v4

      - name: Install zlib headers
        run: apt-get update && apt-get install -y zlib1g-dev

      - name: Run tests
        run: swift test

  coverage-check:
    name: Coverage Check
    runs-on: macos-15
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Generate coverage data
        run: |
          swift test --enable-code-coverage

      - name: Check coverage threshold
        run: |
          .github/workflows/scripts/check-coverage.sh
        continue-on-error: false
